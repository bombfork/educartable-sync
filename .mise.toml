[settings]
env_file = ".env"

[tools]
rust = "stable"
jq = "latest"
hk = "latest"
pkl = "latest"

[tasks.dev]
description = "Run Tauri dev with configurable log level"
usage = '''
flag "--log-level <level>" help="Set the Rust log level" {
  choices "trace" "debug" "info" "warn" "error"
  default "info"
}
'''
run = """
echo "Starting Tauri dev with RUST_LOG=${usage_log_level:-info}"
RUST_LOG=${usage_log_level:-info} cargo tauri dev
"""

[tasks.test]
description = "Run Rust tests"
run = "cargo test --manifest-path src-tauri/Cargo.toml"

[tasks.front]
description = "Run frontend tests"
run = """
npm install
npm run test:run
"""

[tasks.build]
description = "Build the application"
run = "NO_STRIP=1 cargo tauri build"

[tasks.check]
description = "Check Rust code without building"
run = "cargo check --manifest-path src-tauri/Cargo.toml"

[tasks.create-release]
description = "Create a new release with version bump"
usage = '''
flag "--type <type>" help="Version bump type" {
  choices "patch" "minor" "major"
}
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

BUMP_TYPE="${usage_type}"

# Read current version from tauri.conf.json using jq
CURRENT_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
echo "Current version: $CURRENT_VERSION"

# Split version into parts
IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

# Bump version based on type
case "$BUMP_TYPE" in
  major)
    MAJOR=$((MAJOR + 1))
    MINOR=0
    PATCH=0
    ;;
  minor)
    MINOR=$((MINOR + 1))
    PATCH=0
    ;;
  patch)
    PATCH=$((PATCH + 1))
    ;;
esac

NEW_VERSION="$MAJOR.$MINOR.$PATCH"
echo "New version: $NEW_VERSION"

# Update tauri.conf.json using jq
jq --arg version "$NEW_VERSION" '.version = $version' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
echo "✓ Updated src-tauri/tauri.conf.json"

# Update Cargo.toml (match any version pattern, not just current version)
sed -i 's/^version = "[^"]*"/version = "'"$NEW_VERSION"'"/' src-tauri/Cargo.toml
echo "✓ Updated src-tauri/Cargo.toml"

# Update Cargo.lock
cd src-tauri && cargo update -p educartable-sync && cd ..
echo "✓ Updated Cargo.lock"

# Git operations
echo ""
echo "Creating release branch..."
git switch -c "release/v$NEW_VERSION"
echo "✓ Created and switched to branch release/v$NEW_VERSION"
echo "Committing changes..."
git add src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
git commit -m "chore: bump version to $NEW_VERSION"
echo "✓ Committed version bump"

echo "Pushing to origin..."
git push --set-upstream origin "release/v$NEW_VERSION"
echo "✓ Pushed release branch to origin"

echo ""
echo "Creating Pull Request..."
gh pr create --title "chore: release v$NEW_VERSION" --body "This PR prepares the release v$NEW_VERSION." --base main
echo "✓ Created Pull Request"

echo ""
echo "Adding label 'ready-for-tests' to PR..."
PR_NUMBER=$(gh pr view --json number --jq '.number')
gh pr edit "$PR_NUMBER" --add-label "ready-for-tests"
echo "✓ Added label to PR"

echo ""
echo "Enabling auto-merge for PR..."
gh pr merge "$PR_NUMBER" --auto --squash
echo "✓ Enabled auto-merge for PR"

echo ""
echo "Waiting for PR to be merged..."
while true; do
  STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
  if [ "$STATE" = "MERGED" ]; then
    break
  fi
  echo "PR not merged yet. Checking again in 15 seconds..."
  sleep 15
done
echo "✓ PR merged"

echo ""
echo "Switching back to main branch..."
git switch main
echo "✓ Switched to main branch"

echo "Pulling latest changes..."
git pull origin main
echo "✓ Pulled latest changes"

echo ""
echo "Creating tag v$NEW_VERSION..."
git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
echo "✓ Created tag v$NEW_VERSION"

echo "Pushing tag..."
git push origin "v$NEW_VERSION"
echo "✓ Pushed tag v$NEW_VERSION"

echo ""
echo "🎉 Release v$NEW_VERSION created successfully!"
echo "📦 GitHub Actions will now build and publish the release."
echo "🔗 Check progress at: https://github.com/bombfork/educartable-sync/actions/workflows/release.yml"
"""
