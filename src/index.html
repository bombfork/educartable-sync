<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educartable Sync</title>

  <!-- Pico CSS v2 (bundled locally) -->
  <link rel="stylesheet" href="pico.min.css">

  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container">
    <article>
      <header>
        <h1>📚 Educartable Sync</h1>
        <p>Téléchargez et synchronisez les photos des activités scolaires de votre enfant</p>
      </header>

      <!-- Configuration Section -->
      <section id="config-section">
        <h2>⚙️ Configuration</h2>

        <div class="two-column-layout">
          <!-- Left column: Authentication and Updates -->
          <div>
            <div class="config-row">
              <span>Statut : <strong id="auth-status" class="status-disconnected">Non connecté</strong></span>
              <button id="login-btn" class="btn-compact-narrow">Se connecter</button>
              <button id="logout-btn" class="secondary hidden btn-compact">Déconnexion</button>
            </div>

            <div class="config-row">
              <span id="update-status" style="display: none; font-size: 0.9rem;"></span>
              <button id="check-updates-btn" class="secondary btn-compact">
                🔄 Vérifier les mises à jour
              </button>
            </div>
          </div>

          <!-- Right column: Sync path and Logs -->
          <div>
            <div class="config-grid">
              <input type="text" id="sync-path" readonly placeholder="Sélectionnez un dossier de destination">
              <button id="browse-btn" class="secondary btn-compact">Parcourir</button>
            </div>

            <button id="open-logs-btn" class="secondary btn-full-width">
              📋 Ouvrir le dossier des logs
            </button>
          </div>
        </div>
      </section>

      <!-- Sync Section -->
      <section id="sync-section">
        <h2>📥 Synchronisation</h2>

        <button id="sync-btn" disabled>
          Synchroniser maintenant
        </button>

        <div id="sync-progress-container">
          <div class="custom-progress-bar">
            <div id="sync-progress-fill" class="progress-fill"></div>
            <div id="progress-text" class="progress-text">0 / 0 fichiers</div>
          </div>
          <small id="current-file"></small>
        </div>
      </section>
    </article>
  </main>

  <script src="main.js" type="module"></script>
</body>

</html>
