name: Frontend Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

jobs:
  e2e-tests:
    name: Frontend Tests
    # Only run on labeled PRs if the label is 'ready-for-tests', or on push to main
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ready-for-tests')

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4

      - name: Install test dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run
