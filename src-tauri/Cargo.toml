[package]
name = "educartable-sync"
version = "1.1.0"
description = "Synchronisation de photos depuis Educartable"
authors = ["Thomas Nemer"]
edition = "2021"
repository = "https://github.com/bombfork/educartable-sync"
homepage = "https://github.com/bombfork/educartable-sync"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "educartable_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
keyring = "2"
log = "0.4"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }
mockito = "1.5"
rstest = "0.18"
tempfile = "3"

[lints.rust]
# Warn on missing docs for public items (optional, can be strict)
# missing_docs = "warn"

[lints.clippy]
# Pedantic lints for better code quality
pedantic = { level = "warn", priority = -1 }

# Allow some pedantic lints that are too noisy for this codebase
module_name_repetitions = "allow"  # e.g., auth::AuthTokens is fine
too_many_lines = "allow"           # Some functions are necessarily long
missing_errors_doc = "allow"       # Tauri commands have string errors
missing_panics_doc = "allow"       # We avoid panics anyway

# Security-related lints
unwrap_used = "warn"               # Prefer expect() or ? operator
expect_used = "warn"               # Consider proper error handling

# Code quality
clone_on_ref_ptr = "warn"          # Avoid unnecessary Arc clones
redundant_clone = "warn"           # Remove unnecessary clones
inefficient_to_string = "warn"     # Use to_owned() for &str

